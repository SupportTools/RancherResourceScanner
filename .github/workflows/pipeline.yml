name: Build, Test and Publish

# The default branch is main; this used to trigger on master, which does not
# exist, so no job ever ran (taskforge-2814). Pull requests run Test only;
# Build and Publish push the image and the chart, so they run on push to main.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  Test:
    runs-on: self-hosted-linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No actions/setup-go step: the ARC runner image (SupportTools/ci-runners
      # Dockerfile.arc2) bakes Go at /usr/local/go on PATH with GOTOOLCHAIN=local,
      # so the job uses that toolchain and never downloads one (taskforge-2674).
      # Pinning a setup-go version would download Go whenever it drifts from the
      # image's baked GO_VERSION; go.mod's go 1.22.4 builds under the baked Go.
      #
      # gosec is baked into the ARC runner image (SupportTools/ci-runners), so it
      # is not `go install`ed at job time (taskforge-2674). The other four tools
      # this step used to install @latest (golint, staticcheck, go-mod-outdated,
      # deadcode) were never invoked by this workflow and are dropped.
      - name: Show baked tool versions
        run: |
          go version
          gosec -version

      - name: Dependency management
        run: |
          go mod vendor
          go mod verify
          go mod tidy

      - name: Security scanning
        run: |
          gosec ./...

  Build:
    needs: Test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted-linux

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          # Org-wide secrets (visibility ALL). DOCKERHUB_USERNAME/DOCKERHUB_TOKEN
          # exist in neither the repo nor the org (taskforge-2814).
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker build
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --pull \
            --build-arg VERSION=v${{ github.run_number }} \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --cache-from supporttools/rancherresourcescanner:latest \
            -t supporttools/rancherresourcescanner:"v${{ github.run_number }}" \
            -t supporttools/rancherresourcescanner:latest \
            --push \
            -f Dockerfile .
        
  Publish:
    runs-on: self-hosted-linux
    needs:
      - Build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # helm is baked into the ARC runner image; no azure/setup-helm download
      # (taskforge-2674, TaskForge docs/CI_RUNNER_CONTRACT.md "No job-time downloads").
      - name: Show baked helm version
        run: helm version

      - name: Helm Lint
        run: helm lint charts/rancherresourcescanner/

      - name: Package Helm chart
        run: |
          export CHART_VERSION="v${{ github.run_number }}"
          export APP_VERSION="v${{ github.run_number }}"
          export IMAGE_TAG="v${{ github.run_number }}"
          echo "CHART_VERSION=${CHART_VERSION}"
          echo "APP_VERSION=${APP_VERSION}"
          envsubst < charts/rancherresourcescanner/Chart.yaml.template > charts/rancherresourcescanner/Chart.yaml
          envsubst < charts/rancherresourcescanner/values.yaml.template > charts/rancherresourcescanner/values.yaml
          helm package charts/rancherresourcescanner --destination helm/repo

      - name: Mint helm-chart repo token (GitHub App supporttools-chart-publisher)
        id: chart-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CHART_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHART_APP_PRIVATE_KEY }}
          owner: SupportTools
          repositories: helm-chart,helm-chart-private

      - name: Checkout helm-chart repository
        uses: actions/checkout@v4
        with:
          repository: supporttools/helm-chart
          path: helm-chart
          token: ${{ steps.chart-app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config --global user.email "github-action@users.noreply.github.com"
          git config --global user.name "GitHub Action"

      - name: Update Helm repository
        run: |
          cp helm/repo/rancherresourcescanner-*.tgz helm-chart/
          cd helm-chart
          helm repo index . --url https://charts.support.tools/
          git add .
          git commit -m "Update Helm chart for RancherResourceScanner"
          git push
